name: Patch service start and end

on:
  push:
    paths:
      - '.github/workflows/patch-service-window.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Patch drive route and loader
        run: python3 patch-service-window.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _headers
          git diff --cached --quiet && exit 0
          git commit -m "Enable selectable service start and end stops"
          git push
