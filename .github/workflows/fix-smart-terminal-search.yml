name: Add bus terminals to smart detour search

on:
  push:
    paths:
      - '.github/workflows/fix-smart-terminal-search.yml'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch smart terminal search
        run: python3 patch-smart-terminal-search.py

      - name: Commit terminal search
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linne-preset-button.js
          git diff --cached --quiet || git commit -m "Add bus terminals to smart detour search"
          git push

      - name: Deploy patched app to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: eb367029b1b6f6cac7f6524333e889b1
          command: pages deploy . --project-name=gmp-korvag-studio --branch=main
