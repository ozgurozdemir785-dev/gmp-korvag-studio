name: Fix Linne preset button

on:
  push:
    paths:
      - '.github/workflows/fix-linne-button.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Linné button robust and bust browser cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('smart-auto-detour.js')
          s = p.read_text(encoding='utf-8')
          old = "function installSmartAuto(){\n  const box=$id('autoDetourBox');\n  if(!box)return false;\n  installSimpleCard();\n  installLinnePreset();"
          new = "function installSmartAuto(){\n  installSimpleCard();\n  installLinnePreset();\n  const box=$id('autoDetourBox');\n  if(!box)return !!$id('linneNilsPresetBtn');"
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('tries>25', 'tries>500')
          p.write_text(s, encoding='utf-8')

          p = Path('active-detour.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/smart-auto-detour.js?v=blocked-v2-20261015', '/smart-auto-detour.js?v=linne-v3-20261015-1152')
          p.write_text(s, encoding='utf-8')

          p = Path('_worker.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/detour-search.js?v=1', '/detour-search.js?v=20261015-1152')
          s = s.replace('/active-detour.js?v=1', '/active-detour.js?v=20261015-1152')
          p.write_text(s, encoding='utf-8')

          p = Path('detour-search.js')
          s = p.read_text(encoding='utf-8')
          old = "if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{setTimeout(install,0);setTimeout(installAutoHooks,50)});else{setTimeout(install,0);setTimeout(installAutoHooks,50)}\n})();"
          new = "function startDetourInstaller(){\n  let n=0;\n  const run=()=>{n++;try{install();installAutoHooks()}catch(e){console.warn(e)}if($id('autoDetourBox')||n>500)clearInterval(t)};\n  const t=setInterval(run,120);run();\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startDetourInstaller);else startDetourInstaller();\n})();"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "ozgurozdemir785-dev"
          git config user.email "ozgurozdemir785@gmail.com"
          git add smart-auto-detour.js active-detour.js detour-search.js _worker.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix Linné preset button visibility"
          git push
