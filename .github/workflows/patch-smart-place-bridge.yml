name: Patch smart place bridge

on:
  push:
    paths:
      - '.github/workflows/patch-smart-place-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expose safe app bridge for detour navigator
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker="init();\n})();"
          bridge="""window.GMP_APP={state,dir,hav,nearestPointOnRoute,routeSliceByDistance,valhallaBusRoute,smartBusRoute,osrmRoute,buildDriveRoute,setDirection,renderAll,renderStopManager,fitCoords,toast,buildGtfsStopIndex,routeLength,pointAtDistance};\ninit();\n})();"""
          if 'window.GMP_APP={state,dir,hav' not in s:
              if marker not in s:
                  raise SystemExit('init marker not found')
              s=s.replace(marker,bridge,1)
          s=s.replace('/linne-preset-button.js?v=preserve-api-20261015','/linne-preset-button.js?v=smart-place-v4')
          p.write_text(s,encoding='utf-8')
      - name: Commit bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expose navigator bridge for smart detour search"
          git push
