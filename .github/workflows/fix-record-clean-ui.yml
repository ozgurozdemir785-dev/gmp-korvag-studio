name: Fix clean recording UI

on:
  push:
    paths:
      - '.github/workflows/fix-record-clean-ui.yml'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply recording and infrastructure patch
        run: python3 patch-record-clean-ui.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Keep controls usable but out of recordings"
            git push
          fi

      - name: Deploy patched app to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: eb367029b1b6f6cac7f6524333e889b1
          command: pages deploy . --project-name=gmp-korvag-studio --branch=main
