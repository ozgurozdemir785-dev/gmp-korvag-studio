name: Patch 3D Satellite

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-3d-satellite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch 3D satellite view
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = ".googleView{position:absolute;inset:0;z-index:64;background:#0b1523;overflow:hidden}"
          css_fix = ".googleHost>gmp-map-3d{display:block!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important}"
          if css_fix not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor for googleView was not found')
              s = s.replace(css_anchor, css_anchor + css_fix, 1)

          old_map = "if(!google3dMap){google3dMap=new lib.Map3DElement({center:{lat:sample.coord[1],lng:sample.coord[0],altitude:0},tilt:76,range:110,heading:sample.bearing||0,mode:'SATELLITE',defaultUIHidden:true,gestureHandling:'GREEDY',fov:55});$('google3dHost').replaceChildren(google3dMap);bindGoogleFreeCamera()}"
          new_map = "if(!google3dMap){\n   const host=$('google3dHost');\n   google3dMap=new lib.Map3DElement({center:{lat:sample.coord[1],lng:sample.coord[0],altitude:2},tilt:76,range:110,heading:sample.bearing||0,mode:'SATELLITE',defaultUIHidden:true,gestureHandling:'GREEDY',fov:55});\n   google3dMap.style.cssText='display:block;position:absolute;inset:0;width:100%;height:100%;min-width:100%;min-height:100%;';\n   host.replaceChildren(google3dMap);\n   try{await customElements.whenDefined('gmp-map-3d')}catch{}\n   requestAnimationFrame(()=>{if(google3dMap){google3dMap.style.display='block';google3dMap.style.position='absolute';google3dMap.style.inset='0';google3dMap.style.width='100%';google3dMap.style.height='100%';window.dispatchEvent(new Event('resize'))}});\n   setTimeout(()=>{if(!google3dMap)return;const r=google3dMap.getBoundingClientRect();if(r.width<80||r.height<80){google3dMap.style.cssText='display:block!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important;';window.dispatchEvent(new Event('resize'))}},300);\n   bindGoogleFreeCamera()\n  }"
          if old_map in s:
              s = s.replace(old_map, new_map, 1)
          elif "google3dMap.style.cssText='display:block;position:absolute;inset:0;width:100%;height:100%;min-width:100%;min-height:100%;';" not in s:
              raise SystemExit('3D map initialization anchor was not found')

          auth_anchor = "const sc=document.createElement('script');sc.id='googleMapsJs';sc.async=true;sc.defer=true;"
          auth_fix = "window.gm_authFailure=()=>{googleMapsPromise=null;toast('Google Maps API-nyckeln nekades. Kontrollera Maps JavaScript API, fakturering och HTTP-referrer för gmp-korvag-studio.pages.dev.',7000)};\n   const sc=document.createElement('script');sc.id='googleMapsJs';sc.async=true;sc.defer=true;"
          if "Google Maps API-nyckeln nekades" not in s:
              if auth_anchor not in s:
                  raise SystemExit('Google loader anchor was not found')
              s = s.replace(auth_anchor, auth_fix, 1)

          s = s.replace('V8.6 MAP-ONLY RECORDING', 'V8.7 3D SATELLIT FIX', 1)
          s = s.replace('V8.6 MAP-ONLY REC – API + kameraregissör', 'V8.7 3D FIX – API + kameraregissör', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "gmp-korvag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No patch needed"
          else
            git commit -m "Fixa 3D satellit och Google 3D-storlek"
            git push origin main
          fi
