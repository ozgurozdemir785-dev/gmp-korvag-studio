name: Build V8.19 ZIP

on:
  push:
    paths:
      - '.github/workflows/build-v819-drone-speed-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch app
        run: python tools/patch_v819.py

      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "V8.19 stable drone and faster busway terminal flow" || true
          git push

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=gmp-korvag-studio --branch=main

      - name: Build ZIP
        run: |
          ZIP="GMP-Korvag-Studio-V8.19-DRONARE-STABIL-FULL.zip"
          rm -f "$ZIP"
          zip -r "$ZIP" . -x ".git/*" "$ZIP"
          unzip -l "$ZIP" | grep -E "index.html|route-command.js|_worker.js|bus18.glb"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GMP-Korvag-Studio-V8.19-DRONARE-STABIL-FULL
          path: GMP-Korvag-Studio-V8.19-DRONARE-STABIL-FULL.zip
          if-no-files-found: error
          retention-days: 90
