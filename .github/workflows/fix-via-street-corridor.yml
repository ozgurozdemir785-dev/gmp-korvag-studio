name: Fix smart via street corridor

on:
  push:
    paths:
      - '.github/workflows/fix-via-street-corridor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch smart via street corridor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('linne-preset-button.js')
          s = p.read_text(encoding='utf-8')
          marker = 'SMART_VIA_STREET_CORRIDOR_V2'
          if marker not in s:
              s = s.replace('SMART_PLACE_TERMINAL_SEARCH_V1', 'SMART_PLACE_TERMINAL_SEARCH_V1\n   SMART_VIA_STREET_CORRIDOR_V2')
              old = "function classifyMapResult(x,q){\n  const meta=((x.class||'')+' '+(x.type||'')+' '+(x.addresstype||'')+' '+(x.display_name||'')).toLowerCase();\n  const terminal=/bus_station|bus_terminal|coach_station|transportation/.test(meta)||isTerminalName(x.display_name||'');\n  const stop=!terminal&&/bus_stop|platform|public_transport|stop_position|station/.test(meta);\n  return {kind:terminal?'terminal':stop?'stop':'place',name:(x.display_name||q).split(',')[0],detail:(terminal?'Bussterminal / knutpunkt · ':'')+(x.display_name||q),coord:[+x.lon,+x.lat],official:false,terminal,score:terminal?88:stop?55:30};\n}\n"
              new = "function geoStreetLine(g){\n  if(!g)return[];\n  if(g.type==='LineString')return Array.isArray(g.coordinates)?g.coordinates:[];\n  if(g.type==='MultiLineString'&&Array.isArray(g.coordinates))return g.coordinates.slice().sort((a,b)=>b.length-a.length)[0]||[];\n  return[];\n}\nfunction streetCorridor(g,center){\n  const A=app(),line=geoStreetLine(g).filter(c=>Array.isArray(c)&&Number.isFinite(+c[0])&&Number.isFinite(+c[1])).map(c=>[+c[0],+c[1]]);\n  if(!A||line.length<2)return[];\n  let ci=0,bd=Infinity;for(let i=0;i<line.length;i++){const d=A.hav(line[i],center);if(d<bd){bd=d;ci=i}}\n  let lo=ci,hi=ci,back=0,fwd=0;\n  while(lo>0&&back<500){back+=A.hav(line[lo],line[lo-1]);lo--}\n  while(hi<line.length-1&&fwd<500){fwd+=A.hav(line[hi],line[hi+1]);hi++}\n  const seg=line.slice(lo,hi+1);if(seg.length<2)return[];\n  const max=9;if(seg.length<=max)return seg;\n  const out=[seg[0]];for(let i=1;i<max-1;i++)out.push(seg[Math.round(i*(seg.length-1)/(max-1))]);out.push(seg.at(-1));return out;\n}\nfunction classifyMapResult(x,q){\n  const meta=((x.class||'')+' '+(x.type||'')+' '+(x.addresstype||'')+' '+(x.display_name||'')).toLowerCase();\n  const terminal=/bus_station|bus_terminal|coach_station|transportation/.test(meta)||isTerminalName(x.display_name||'');\n  const stop=!terminal&&/bus_stop|platform|public_transport|stop_position|station/.test(meta);\n  const street=!terminal&&!stop&&(x.class==='highway'||/ highway | road | street /.test(' '+meta+' '));\n  const coord=[+x.lon,+x.lat],corridor=street?streetCorridor(x.geojson,coord):[];\n  return {kind:terminal?'terminal':stop?'stop':street?'street':'place',name:(x.display_name||q).split(',')[0],detail:(terminal?'Bussterminal / knutpunkt · ':street&&corridor.length?'GATA – följer gatans sträckning · ':'')+(x.display_name||q),coord,official:false,terminal,street,corridor,score:terminal?88:stop?55:street?72:30};\n}\n"
              if old not in s:
                  raise SystemExit('classifyMapResult block not found')
              s = s.replace(old, new)
              s = s.replace("const u='/geo/search?format=json&addressdetails=1&limit=8&countrycodes=se&q='+encodeURIComponent(qq);", "const u='/geo/search?format=json&addressdetails=1&polygon_geojson=1&limit=8&countrycodes=se&q='+encodeURIComponent(qq);")
              s = s.replace("x.kind==='terminal'?'🚌':x.kind==='stop'?'🚏':'📍'", "x.kind==='terminal'?'🚌':x.kind==='stop'?'🚏':x.kind==='street'?'🛣️':'📍'")
              insert = "function smartViaRoutePoints(start,items,end,A){\n  const out=[[+start[0],+start[1]]];let cur=out[0];\n  for(let vi=0;vi<items.length;vi++){\n    const x=items[vi],next=items[vi+1]?.coord||end;\n    let corr=(x?.corridor||[]).filter(c=>Array.isArray(c)&&c.length>=2).map(c=>[+c[0],+c[1]]);\n    if(corr.length>1){\n      const normal=A.hav(cur,corr[0])+A.hav(corr.at(-1),next),rev=A.hav(cur,corr.at(-1))+A.hav(corr[0],next);\n      if(rev<normal)corr=corr.slice().reverse();\n      for(const c of corr)if(A.hav(out.at(-1),c)>12)out.push(c);\n    }else if(x?.coord&&A.hav(out.at(-1),x.coord)>12)out.push([+x.coord[0],+x.coord[1]]);\n    cur=out.at(-1);\n  }\n  if(A.hav(out.at(-1),end)>5)out.push([+end[0],+end[1]]);else out[out.length-1]=[+end[0],+end[1]];\n  return out;\n}\n"
              anchor = 'function nearestIdx(route,p,A){'
              if anchor not in s:
                  raise SystemExit('nearestIdx anchor not found')
              s = s.replace(anchor, insert + anchor)
              s = s.replace('const points=[start,...viaPoints.map(x=>x.coord),end];', 'const points=smartViaRoutePoints(start,viaPoints,end,A);')
              s = s.replace("${esc(x.name)} <button type=\"button\" data-x=\"${i}\">×</button>", "${esc(x.name)}${x.corridor?.length?' · följ gata':''} <button type=\"button\" data-x=\"${i}\">×</button>")
              p.write_text(s, encoding='utf-8')
          PY

      - name: Patch 3D bridge deck altitude
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='BRIDGE_ALTITUDE_DECK_FIX_V2'
          if marker not in s:
              old="""function googleAltitudeMode(sample=null,route=null){if(!state.rules.groundLevel)return'RELATIVE_TO_MESH';const k=infrastructureKindForSample(sample,route);return(k==='bridge'||k==='tunnel')?'RELATIVE_TO_MESH':'RELATIVE_TO_GROUND'}
function googleVehicleAltitude(sample=null,route=null){const k=infrastructureKindForSample(sample,route);return k==='bridge'?1.45:k==='tunnel'?.18:.12}"""
              new="""/* BRIDGE_ALTITUDE_DECK_FIX_V2 */
function googleInfrastructureMeta(sample=null,route=null){
  const rr=route||state.driveRoute||buildDriveRoute(dir());
  try{return roadMetaForDistance(sample?.distance||0,rr,dir())||{}}catch{return{}}
}
function googleBridgeDeckAltitude(sample=null,route=null){
  const m=googleInfrastructureMeta(sample,route),e=Number(m?.meanElevation);
  if(Number.isFinite(e)&&e>1)return e+1.45;
  const layer=Math.max(1,Math.abs(Number(m?.layer)||1));
  return Math.min(32,Math.max(8.5,layer*6.5+2));
}
function googleAltitudeMode(sample=null,route=null){
  if(!state.rules.groundLevel)return'RELATIVE_TO_MESH';
  const k=infrastructureKindForSample(sample,route);
  if(k==='bridge'){
    const e=Number(googleInfrastructureMeta(sample,route)?.meanElevation);
    return Number.isFinite(e)&&e>1?'ABSOLUTE':'RELATIVE_TO_GROUND';
  }
  return k==='tunnel'?'RELATIVE_TO_MESH':'RELATIVE_TO_GROUND';
}
function googleVehicleAltitude(sample=null,route=null){
  const k=infrastructureKindForSample(sample,route);
  if(k==='bridge')return googleBridgeDeckAltitude(sample,route);
  return k==='tunnel'?.18:.12;
}"""
              if old not in s:
                  raise SystemExit('Altitude function block not found')
              s=s.replace(old,new)
              s=s.replace("google3dFallbackMarker.position={lat:modelC[1],lng:modelC[0],altitude:2};", "google3dFallbackMarker.position={lat:modelC[1],lng:modelC[0],altitude:googleVehicleAltitude(sample,route)+.55};")
              s=s.replace("google3dSignalLeft.position={lat:lpos[1],lng:lpos[0],altitude:1.25};", "google3dSignalLeft.position={lat:lpos[1],lng:lpos[0],altitude:googleVehicleAltitude(sample,route)+.35};")
              s=s.replace("google3dSignalRight.position={lat:rpos[1],lng:rpos[0],altitude:1.25};", "google3dSignalRight.position={lat:rpos[1],lng:rpos[0],altitude:googleVehicleAltitude(sample,route)+.35};")
              s=s.replace("position:{lat:sample.coord[1],lng:sample.coord[0],altitude:2},altitudeMode:googleAltitudeMode(sample,route),label:'🚌 BUSS'", "position:{lat:sample.coord[1],lng:sample.coord[0],altitude:googleVehicleAltitude(sample,route)+.55},altitudeMode:googleAltitudeMode(sample,route),label:'🚌 BUSS'")
              s=s.replace("position:{lat:pose.center[1],lng:pose.center[0],altitude:1.2},altitudeMode:googleAltitudeMode(sample,route),label:'●'", "position:{lat:pose.center[1],lng:pose.center[0],altitude:googleVehicleAltitude(sample,route)+.35},altitudeMode:googleAltitudeMode(sample,route),label:'●'")
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add linne-preset-button.js index.html
            git commit -m 'Keep 3D bus on bridge deck'
            git push
          fi

      - name: Deploy patched app to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: eb367029b1b6f6cac7f6524333e889b1
          command: pages deploy . --project-name=gmp-korvag-studio --branch=main
