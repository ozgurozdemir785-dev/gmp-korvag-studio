name: Deploy GMP Korvag Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: eb367029b1b6f6cac7f6524333e889b1
          command: pages deploy . --project-name=gmp-korvag-studio --branch=main

# 3D satellite fix deployed via main
