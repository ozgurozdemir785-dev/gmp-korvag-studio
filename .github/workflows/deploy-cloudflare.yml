name: Deploy GMP Korvag Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load 3D bridge altitude runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/bridge-altitude-runtime.js?v=20261016-bridge-v1"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html saknar </body>')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          print('Bridge runtime loaded:', tag in s)
          PY

      - name: Deploy to existing Cloudflare Pages project
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: eb367029b1b6f6cac7f6524333e889b1
          command: pages deploy . --project-name=gmp-korvag-studio --branch=main

      - name: Verify deployed site
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Cloudflare returned no deployment URL"
            exit 1
          fi
          echo "Checking $DEPLOYMENT_URL"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 "$DEPLOYMENT_URL" >/dev/null; then
              echo "Cloudflare deployment is reachable"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "Deployment could not be reached after retries"
          exit 1

      - name: Keep only current production deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eb367029b1b6f6cac7f6524333e889b1
          PROJECT_NAME: gmp-korvag-studio
        run: |
          set -euo pipefail

          deployments=$(npx --no-install wrangler pages deployment list --project-name "$PROJECT_NAME" --json)
          keep_id=$(jq -r '[.[] | select(.Environment == "Production")][0].Id // empty' <<<"$deployments")

          if [ -z "$keep_id" ]; then
            echo "No active production deployment found; cleanup aborted."
            exit 1
          fi

          echo "Keeping production deployment: $keep_id"
          mapfile -t old_ids < <(jq -r --arg keep "$keep_id" '.[] | select(.Id != $keep) | .Id' <<<"$deployments")

          if [ ${#old_ids[@]} -eq 0 ]; then
            echo "No old deployments to remove."
            exit 0
          fi

          failures=0
          for id in "${old_ids[@]}"; do
            echo "Removing old deployment: $id"
            if npx --no-install wrangler pages deployment delete "$id" --project-name "$PROJECT_NAME" --force; then
              echo "Removed: $id"
            else
              echo "Cloudflare kept deployment $id (for example, an active branch alias)."
              failures=$((failures+1))
            fi
          done

          remaining=$(npx --no-install wrangler pages deployment list --project-name "$PROJECT_NAME" --json)
          echo "Remaining deployments:"
          jq -r '.[] | "\(.Environment)  \(.Id)  \(.Url // "")"' <<<"$remaining"

          remaining_count=$(jq 'length' <<<"$remaining")
          if [ "$remaining_count" -eq 1 ]; then
            echo "Cleanup complete: only active production remains."
          else
            echo "Cleanup finished, but Cloudflare protected $((remaining_count-1)) deployment(s)."
          fi

# 3D satellite + bridge deck fixes deploy via main
