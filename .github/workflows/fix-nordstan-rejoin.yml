name: Fix Nordstan alias and rejoin

on:
  push:
    paths:
      - '.github/workflows/fix-nordstan-rejoin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stop aliases and detour rejoin
        run: python3 patch-nordstan-rejoin.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linne-preset-button.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Nordstan alias and Nils Ericson rejoin"
          git push
