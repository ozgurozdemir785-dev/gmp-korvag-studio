name: Patch Active Detour Route

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-active-detour.yml'
      - '.github/scripts/inject-active-detour.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject active detour runtime
        run: python .github/scripts/inject-active-detour.py

      - name: Commit worker update
        run: |
          git config user.name "gmp-korvag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _worker.js
          if git diff --cached --quiet; then
            echo "No worker update needed"
          else
            git commit -m "Load active detour runtime"
            git push origin main
          fi
